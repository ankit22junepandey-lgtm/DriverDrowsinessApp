<!DOCTYPE html>
<html>
<head>
<title>Driver Drowsiness Detection</title>
<style>
body{
font-family: Arial;
text-align:center;
margin-top:100px;
}

.container{
border:1px solid #ddd;
padding:30px;
width:400px;
margin:auto;
border-radius:10px;
}

button{
padding:10px 20px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h2>Driver Drowsiness Detection</h2>

<form action="/predict" method="post" enctype="multipart/form-data">

<input type="file" name="file" required>
<br><br>

<button type="submit">Predict</button>

</form>

{% if prediction %}
<h3>Result: {{ prediction }}</h3>
{% endif %}

</div>

</body>
</html>
