<!DOCTYPE html>
<html>
<head>
<title>Driver Drowsiness Detection</title>
</head>

<body>

<h2>Driver Drowsiness Detection (Webcam)</h2>

<video id="video" width="320" height="240" autoplay></video>
<br><br>

<button onclick="capture()">Capture & Predict</button>

<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>

<h3 id="result"></h3>

<script>

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
document.getElementById("video").srcObject = stream;
});

function capture(){

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

ctx.drawImage(video,0,0,224,224);

let data = canvas.toDataURL("image/jpeg");

fetch("/predict",{
method:"POST",
body:data
})
.then(res=>res.text())
.then(data=>{
document.getElementById("result").innerText = "Prediction: " + data;
});

}

</script>

</body>
</html>
